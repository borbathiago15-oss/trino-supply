<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trino Supply — Portal do Fornecedor</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #fff; --muted: #f1f5f9; --text: #0f172a; --text-muted: #64748b;
      --brand: #1d4ed8; --brand-dark: #1e40af; --danger: #b91c1c; --ok: #15803d; --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--muted); color: var(--text); min-height: 100vh; }
    .topbar { background: var(--bg); color: #fff; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; }
    .topbar .mark { font-weight: 800; font-size: 17px; }
    .topbar .mark span { color: #93c5fd; }
    .topbar .who { font-size: 13px; color: #cbd5e1; display: flex; gap: 10px; align-items: center; }
    .wrap { max-width: 880px; margin: 22px auto; padding: 0 16px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    h1 { font-size: 17px; margin-bottom: 14px; }
    h2 { font-size: 13px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); }
    h2:first-child { margin-top: 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
    input, select { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; background: #fff; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29,78,216,.15); }
    button { padding: 10px 16px; font-size: 14px; font-weight: 600; color: #fff; background: var(--brand); border: 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: var(--brand-dark); }
    button.secondary { background: transparent; color: var(--brand); border: 1px solid var(--border); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid #fecaca; }
    .full { width: 100%; margin-top: 14px; padding: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: left; font-size: 11.5px; text-transform: uppercase; color: var(--text-muted); padding: 8px; border-bottom: 1px solid var(--border); }
    td { padding: 9px 8px; border-bottom: 1px solid var(--muted); vertical-align: middle; }
    .sub { color: var(--text-muted); font-size: 12px; }
    .badge { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: #e0e7ff; color: var(--brand-dark); }
    .badge.on { background: #dcfce7; color: var(--ok); }
    .badge.off { background: #fee2e2; color: var(--danger); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
    #toast { position: fixed; top: 14px; right: 14px; z-index: 50; display: none; max-width: 360px; padding: 12px 15px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(2,6,23,.25); }
    #toast.ok { display: block; background: #f0fdf4; color: var(--ok); border: 1px solid #bbf7d0; }
    #toast.error { display: block; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="toast"></div>
  <div class="topbar">
    <div class="mark">TRINO <span>SUPPLY</span> · Portal do Fornecedor</div>
    <div class="who hidden" id="who"><span id="sup-name"></span><button class="danger" id="logout">Sair</button></div>
  </div>

  <div class="wrap">
    <!-- login -->
    <div class="panel" id="login-panel">
      <h1>Acesso do Fornecedor</h1>
      <p class="sub">Informe o CNPJ/CPF do seu cadastro e a chave de acesso fornecida pelo time de Suprimentos.</p>
      <form id="login-form">
        <label for="taxid">CNPJ / CPF</label>
        <input id="taxid" required placeholder="somente números" autocomplete="username" />
        <label for="key">Chave de acesso</label>
        <input id="key" required type="password" autocomplete="current-password" />
        <button class="full" type="submit">Entrar no portal</button>
      </form>
    </div>

    <!-- lista -->
    <div class="panel hidden" id="list-panel">
      <h1>Minhas Cotações</h1>
      <div class="grid2">
        <input id="search" placeholder="Pesquisar pelo número (ex.: RFQ-2026-000001)" />
        <button class="secondary" id="refresh">Atualizar</button>
      </div>
      <div id="list" style="margin-top:12px"></div>
    </div>

    <!-- detalhe -->
    <div class="panel hidden" id="detail-panel"></div>
  </div>

  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const money = (v) => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
    function toast(text, kind) { const el = $('toast'); el.textContent = text; el.className = kind; clearTimeout(el._t); el._t = setTimeout(() => el.className = '', 4500); }
    const store = {
      get token() { return sessionStorage.getItem('portal.token'); },
      set token(v) { v ? sessionStorage.setItem('portal.token', v) : sessionStorage.removeItem('portal.token'); },
    };
    let current = null;

    async function api(path, options = {}) {
      const res = await fetch(path, {
        method: options.method || 'GET',
        headers: { ...(options.form ? {} : { 'Content-Type': 'application/json' }), ...(store.token ? { Authorization: 'Bearer ' + store.token } : {}) },
        body: options.form ? options.form : (options.body !== undefined ? JSON.stringify(options.body) : undefined),
      });
      if (res.status === 401) { store.token = null; show('login'); throw new Error('Sessão expirada — entre novamente.'); }
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error?.message || 'Falha na operação.');
      return json.data ?? json;
    }

    function show(view) {
      $('login-panel').classList.toggle('hidden', view !== 'login');
      $('list-panel').classList.toggle('hidden', view !== 'list');
      $('detail-panel').classList.toggle('hidden', view !== 'detail');
      $('who').classList.toggle('hidden', view === 'login');
    }

    $('login-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      try {
        const data = await api('/api/v1/portal/login', { method: 'POST', body: { taxId: $('taxid').value, accessKey: $('key').value } });
        store.token = data.accessToken;
        $('sup-name').textContent = data.supplier.name;
        show('list');
        loadList();
      } catch (err) { toast(err.message, 'error'); }
    });
    $('logout').addEventListener('click', () => { store.token = null; show('login'); });
    $('refresh').addEventListener('click', () => loadList());
    $('search').addEventListener('change', () => loadList());

    async function loadList() {
      try {
        const q = $('search').value ? '?number=' + encodeURIComponent($('search').value) : '';
        const { items } = await api('/api/v1/portal/quotations' + q);
        $('list').innerHTML = items.length
          ? '<table><thead><tr><th>Número</th><th>Tipo</th><th>Prazo</th><th>Situação</th><th>Minhas propostas</th><th></th></tr></thead><tbody>' +
            items.map(c => `
              <tr data-id="${c.id}">
                <td><strong>${esc(c.number)}</strong></td>
                <td>${esc(c.kind)}</td>
                <td>${c.deadline || '—'}</td>
                <td><span class="badge ${c.open ? 'on' : 'off'}">${c.status}</span></td>
                <td>${c.myProposals.length ? c.myProposals.length + ' versão(ões)' : '—'}</td>
                <td><button data-act="open">Abrir</button></td>
              </tr>`).join('') + '</tbody></table>'
          : '<p class="sub">Nenhuma cotação localizada para o seu cadastro.</p>';
      } catch (err) { toast(err.message, 'error'); }
    }

    $('list').addEventListener('click', async (ev) => {
      const btn = ev.target.closest('button[data-act="open"]');
      if (!btn) return;
      try {
        current = await api('/api/v1/portal/quotations/' + btn.closest('tr').dataset.id);
        renderDetail();
        show('detail');
      } catch (err) { toast(err.message, 'error'); }
    });

    function renderDetail() {
      const c = current;
      let html = `<h1>${esc(c.number)} <span class="badge ${c.open ? 'on' : 'off'}">${c.status}</span></h1>
        <p class="sub">${esc(c.kind)} · prazo para resposta: ${c.deadline || 'a combinar'}${c.notes ? ' · ' + esc(c.notes) : ''}</p>
        <h2>Itens solicitados</h2>
        <table><thead><tr><th>#</th><th>Descrição</th><th>Qtd</th><th>Unid.</th></tr></thead><tbody>` +
        c.items.map(i => `<tr><td>${i.sequence}</td><td>${esc(i.description)}</td><td>${i.quantity}</td><td>${esc(i.unitOfMeasure)}</td></tr>`).join('') +
        '</tbody></table>';

      if (c.open) {
        html += `<h2>Enviar proposta${c.myProposals.length ? ' (nova versão substitui a anterior na análise)' : ''}</h2>
          <table><tbody>` +
          c.items.map(i => `<tr><td>${esc(i.description)} <span class="sub">(${i.quantity} ${esc(i.unitOfMeasure)})</span></td>
            <td style="width:140px"><input class="pp-price" data-item="${i.id}" type="number" min="0" step="0.01" placeholder="R$ unitário" required /></td></tr>`).join('') +
          `</tbody></table>
          <div class="grid2">
            <div><label>Prazo de entrega (dias)</label><input id="pp-delivery" type="number" min="0" /></div>
            <div><label>Condição de pagamento</label><input id="pp-payment" placeholder="ex.: 28 dias / boleto" /></div>
          </div>
          <div class="grid2">
            <div><label>Frete (R$)</label><input id="pp-freight" type="number" min="0" step="0.01" placeholder="0,00" /></div>
            <div><label>Validade da proposta</label><input id="pp-valid" type="date" /></div>
          </div>
          <label>Observações</label>
          <input id="pp-notes" placeholder="opcional" />
          <label>Anexo da proposta comercial (PDF/PNG/JPG/XLSX/DOCX, até 10 MB)</label>
          <input id="pp-file" type="file" accept=".pdf,.png,.jpg,.jpeg,.xlsx,.docx" />
          <button class="full" id="pp-send">Enviar proposta</button>`;
      }

      html += '<h2>Histórico das minhas propostas</h2>';
      html += c.myProposals.length
        ? '<table><thead><tr><th>Versão</th><th>Total</th><th>Prazo</th><th>Pagamento</th><th>Enviada em</th><th>Anexo</th></tr></thead><tbody>' +
          c.myProposals.map(p => `
            <tr><td>v${p.version}</td><td><strong>${money(p.totalValue)}</strong></td>
            <td>${p.deliveryDays ?? '—'} dias</td><td>${esc(p.paymentTerms || '—')}</td>
            <td class="sub">${new Date(p.submittedAt).toLocaleString('pt-BR')}</td>
            <td>${p.attachmentFileName ? esc(p.attachmentFileName) : '—'}</td></tr>`).join('') + '</tbody></table>'
        : '<p class="sub">Nenhuma proposta enviada ainda.</p>';

      html += '<button class="secondary full" id="back">← Voltar às minhas cotações</button>';
      $('detail-panel').innerHTML = html;

      $('back').addEventListener('click', () => { show('list'); loadList(); });
      $('pp-send')?.addEventListener('click', async () => {
        try {
          const items = [...document.querySelectorAll('.pp-price')].map(i => ({
            quotationItemId: i.dataset.item, unitPrice: parseFloat(i.value), quantity: null,
          }));
          if (items.some(i => isNaN(i.unitPrice))) { toast('Informe o preço de todos os itens.', 'error'); return; }
          const proposal = await api(`/api/v1/portal/quotations/${c.id}/proposal`, { method: 'POST', body: {
            deliveryDays: $('pp-delivery').value ? parseInt($('pp-delivery').value) : null,
            paymentTerms: $('pp-payment').value || null,
            freightValue: $('pp-freight').value ? parseFloat($('pp-freight').value) : null,
            validUntil: $('pp-valid').value || null,
            notes: $('pp-notes').value || null, items,
          }});
          const file = $('pp-file').files[0];
          if (file) {
            const form = new FormData();
            form.append('file', file);
            await api(`/api/v1/portal/proposals/${proposal.id}/attachment`, { method: 'POST', form });
          }
          toast(`Proposta v${proposal.version} enviada com sucesso — total ${money(proposal.totalValue)}.`, 'ok');
          current = await api('/api/v1/portal/quotations/' + c.id);
          renderDetail();
        } catch (err) { toast(err.message, 'error'); }
      });
    }

    if (store.token) { show('list'); loadList(); } else show('login');
  </script>
</body>
</html>
