# Piloto do Trino Supply — sobe a stack completa com um comando:
#   docker compose -f deploy/docker-compose.pilot.yml up --build
# Depois: http://localhost:3000  (provisione uma empresa via POST /api/v1/companies).
#
# NÃO é configuração de produção endurecida (segredos em texto, sem TLS). Para produção,
# ver OPS-001 (segredos em cofre) e ARC-016 (Cloudflare na borda, Postgres gerenciado).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: trino
      POSTGRES_DB: trino
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trino -d trino"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  # Aplica migrations (scripts idempotentes do EF) + provisiona a role da aplicação. Roda e sai.
  bootstrap:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: trino
      DB_PASSWORD: trino
      DB_NAME: trino
    volumes:
      - ./db/gen:/sql:ro
      - ./bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=trino;Username=trino_app;Password=apppw"
      Jwt__Issuer: "trino-supply"
      Jwt__Audience: "trino-supply"
      Jwt__Keys__0__Kid: "pilot-1"
      Jwt__Keys__0__Secret: "troque-esta-chave-de-piloto-com-mais-de-32-bytes!!"
    ports:
      - "5098:8080"

  # Relay do Outbox (ARC-005): drena eventos de negócio pendentes e os publica.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=trino;Username=trino_app;Password=apppw"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      BACKEND_URL: "http://api:8080"
    ports:
      - "3000:3000"
