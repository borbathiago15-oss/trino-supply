# Pipeline CI do Trino Supply (OPS-001 §1). Gates: build → testes → análise.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest
    # Testes de integração usam Testcontainers (Docker já disponível no runner ubuntu).
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TrinoSupply.slnx
      - name: Build
        run: dotnet build TrinoSupply.slnx --configuration Release --no-restore
      # Unidade primeiro (rápido, sem Docker) → falha cedo se o domínio quebrar.
      # Coleta cobertura do DOMÍNIO e aplica um gate (linha ≥ 50%) — evita regressão de cobertura.
      - name: Unit tests (+ gate de cobertura do domínio)
        run: >-
          dotnet test tests/TrinoSupply.Domain.Tests/TrinoSupply.Domain.Tests.csproj
          --configuration Release --logger "trx;LogFileName=domain.trx"
          /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura
          /p:Include="[TrinoSupply.*Domain]*"
          /p:Threshold=50 /p:ThresholdType=line /p:ThresholdStat=total
      # Integração com Testcontainers (Postgres + RabbitMQ reais; Docker já roda no runner ubuntu).
      - name: Integration tests (Testcontainers)
        run: >-
          dotnet test tests/TrinoSupply.Integration.Tests/TrinoSupply.Integration.Tests.csproj
          --configuration Release --no-build --logger "trx;LogFileName=integration.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
      # TODO(OPS-001): SAST + secret scanning + verificação de imagem (gates de segurança — SEC-003).

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm run build --if-present
