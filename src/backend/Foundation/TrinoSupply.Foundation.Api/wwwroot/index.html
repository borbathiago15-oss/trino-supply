<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trino Supply — Acesso</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --brand: #1d4ed8;
      --brand-dark: #1e40af;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --ok: #15803d;
      --border: #e2e8f0;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 60%, #1d4ed8 140%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: var(--text); padding: 24px;
    }
    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(2, 6, 23, .45);
      width: 100%; max-width: 420px; padding: 40px 36px;
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand .mark {
      font-size: 28px; font-weight: 800; letter-spacing: -.5px;
    }
    .brand .mark span { color: var(--brand); }
    .brand .tag { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
    h1 { font-size: 18px; margin-bottom: 20px; font-weight: 600; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; font-size: 15px;
      border: 1px solid var(--border); border-radius: 8px; outline: none;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(29, 78, 216, .15); }
    button {
      width: 100%; margin-top: 22px; padding: 12px; font-size: 15px; font-weight: 600;
      color: #fff; background: var(--brand); border: 0; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: .6; cursor: wait; }
    .error {
      display: none; margin-top: 16px; padding: 12px; font-size: 13.5px;
      background: var(--danger-bg); color: var(--danger);
      border: 1px solid #fecaca; border-radius: 8px;
    }
    .error[data-show="true"] { display: block; }
    .footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted); }
    /* --- área autenticada --- */
    .hello { font-size: 15px; color: var(--text-muted); margin-bottom: 20px; }
    .hello strong { color: var(--text); }
    .modules { display: grid; gap: 10px; }
    .module {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface-muted); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px; font-size: 14px;
    }
    .badge {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px;
      background: #e0e7ff; color: var(--brand-dark);
    }
    .badge.dev { background: #fef9c3; color: #854d0e; }
    .logout {
      margin-top: 22px; background: transparent; color: var(--danger);
      border: 1px solid #fecaca;
    }
    .logout:hover { background: var(--danger-bg); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="mark">TRINO <span>SUPPLY</span></div>
      <div class="tag">Enterprise Supply Management</div>
    </div>

    <section id="login-view">
      <h1>Entrar na plataforma</h1>
      <form id="login-form" autocomplete="on">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" required autocomplete="username" />
        <label for="password">Senha</label>
        <input id="password" type="password" name="password" required autocomplete="current-password" minlength="1" />
        <button id="submit" type="submit">Entrar</button>
      </form>
      <div id="error" class="error" role="alert" aria-live="polite"></div>
    </section>

    <section id="app-view" hidden>
      <h1>Bem-vindo</h1>
      <p class="hello">Sessão ativa como <strong id="user-name"></strong> (<span id="user-role"></span>)</p>
      <div class="modules">
        <div class="module"><span>Foundation — Identidade</span><span class="badge">ATIVO</span></div>
        <div class="module"><span>PR-001 — Requisição de Compra</span><span class="badge dev">EM DESENVOLVIMENTO</span></div>
        <div class="module"><span>MMS-002 — Catálogo de Itens</span><span class="badge dev">EM DESENVOLVIMENTO</span></div>
        <div class="module"><span>MMS-004 — Estoque</span><span class="badge dev">EM DESENVOLVIMENTO</span></div>
      </div>
      <button id="logout" class="logout" type="button">Sair</button>
    </section>

    <div class="footer">Trino Supply · acesso restrito e auditado</div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const store = {
      get access() { try { return sessionStorage.getItem('ts.access'); } catch { return null; } },
      set(tokens) {
        try {
          sessionStorage.setItem('ts.access', tokens.accessToken);
          sessionStorage.setItem('ts.refresh', tokens.refreshToken);
        } catch { /* modo privado: sessão só em memória */ }
      },
      get refresh() { try { return sessionStorage.getItem('ts.refresh'); } catch { return null; } },
      clear() { try { sessionStorage.clear(); } catch {} },
    };

    function showError(msg) { const e = $('error'); e.textContent = msg; e.dataset.show = 'true'; }
    function clearError() { $('error').dataset.show = 'false'; }

    function showApp(user) {
      $('login-view').hidden = true;
      $('app-view').hidden = false;
      $('user-name').textContent = user.name || user.email;
      $('user-role').textContent = user.role || '';
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        method: options.method || 'GET',
        headers: {
          'Content-Type': 'application/json',
          ...(options.auth && store.access ? { Authorization: 'Bearer ' + store.access } : {}),
        },
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw json.error || { message: 'Falha de comunicação com o servidor.' };
      return json.data;
    }

    $('login-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      clearError();
      const btn = $('submit');
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        const data = await api('/api/v1/auth/login', {
          method: 'POST',
          body: { email: $('email').value, password: $('password').value },
        });
        store.set(data);
        showApp(data.user);
      } catch (err) {
        showError(err.message || 'E-mail ou senha inválidos.');
      } finally {
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });

    $('logout').addEventListener('click', async () => {
      try { await api('/api/v1/auth/logout', { method: 'POST', body: { refreshToken: store.refresh } }); } catch {}
      store.clear();
      $('app-view').hidden = true;
      $('login-view').hidden = false;
    });

    // sessão existente? valida o token contra /me
    (async () => {
      if (!store.access) return;
      try { showApp(await api('/api/v1/auth/me', { auth: true })); } catch { store.clear(); }
    })();
  </script>
</body>
</html>
