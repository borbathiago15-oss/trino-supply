# Piloto do Trino Supply — sobe a stack completa com um comando:
#   docker compose -f deploy/docker-compose.pilot.yml up --build
# Depois: http://localhost:3000  (provisione uma empresa via POST /api/v1/companies).
#
# NÃO é configuração de produção endurecida (segredos em texto, sem TLS). Para produção,
# ver OPS-001 (segredos em cofre) e ARC-016 (Cloudflare na borda, Postgres gerenciado).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: trino
      POSTGRES_DB: trino
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trino -d trino"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  # Broker de eventos (ARC-005): o Worker publica os eventos do Outbox aqui.
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: trino
      RABBITMQ_DEFAULT_PASS: trino
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "15672:15672"  # console de gestão

  # Aplica migrations (scripts idempotentes do EF) + provisiona a role da aplicação. Roda e sai.
  bootstrap:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: trino
      DB_PASSWORD: trino
      DB_NAME: trino
      # Senha da role da aplicação (trino_app). Troque em produção (e nas connection strings abaixo).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-apppw}
    volumes:
      - ./db/gen:/sql:ro
      - ./bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=trino;Username=trino_app;Password=${APP_DB_PASSWORD:-apppw}"
      Jwt__Issuer: "trino-supply"
      Jwt__Audience: "trino-supply"
      Jwt__Keys__0__Kid: "pilot-1"
      Jwt__Keys__0__Secret: ${JWT_SIGNING_SECRET:-troque-esta-chave-de-piloto-com-mais-de-32-bytes!!}
      # Provisionamento de empresas (POST /companies) exige este header X-Provisioning-Key (SEC-001).
      Provisioning__Key: ${PROVISIONING_KEY:-chave-de-provisionamento-do-piloto}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    ports:
      - "5098:8080"

  # Relay do Outbox (ARC-005): drena eventos de negócio pendentes e os publica.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=trino;Username=trino_app;Password=${APP_DB_PASSWORD:-apppw}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "trino"
      RabbitMq__Password: "trino"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: "http://api:8080"
    ports:
      - "3000:3000"
