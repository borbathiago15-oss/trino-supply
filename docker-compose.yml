# Ambiente local de desenvolvimento — Trino Supply
# Uso: docker compose up --build  →  http://localhost:8080

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: trino_supply
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:devpass@db:5432/trino_supply
      JWT_SECRET: troque-este-segredo-local-com-no-minimo-32-caracteres
      ADMIN_EMAIL: admin@grupotrino.com.br
      ADMIN_PASSWORD: TroqueEstaSenha#Local1
      ADMIN_NAME: Administrador
    ports:
      - "8080:8080"

volumes:
  pgdata:
