# Piloto do Trino Supply — sobe a stack completa com um comando:
#   docker compose -f deploy/docker-compose.pilot.yml up --build
# Depois: http://localhost:3000  (provisione uma empresa via POST /api/v1/companies).
#
# NÃO é configuração de produção endurecida (segredos em texto, sem TLS). Para produção,
# ver OPS-001 (segredos em cofre) e ARC-016 (Cloudflare na borda, Postgres gerenciado).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: trino
      POSTGRES_DB: trino
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trino -d trino"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  # Broker de eventos (ARC-005): o Worker publica os eventos do Outbox aqui.
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: trino
      RABBITMQ_DEFAULT_PASS: trino
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "15672:15672"  # console de gestão

  # Aplica migrations (scripts idempotentes do EF) + provisiona a role da aplicação. Roda e sai.
  bootstrap:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: trino
      DB_PASSWORD: trino
      DB_NAME: trino
      # Senhas das roles da aplicação/worker. Troque em produção (e nas connection strings abaixo).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-apppw}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-workerpw}
    volumes:
      - ./db/gen:/sql:ro
      - ./bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["sh", "/bootstrap.sh"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=trino;Username=trino_app;Password=${APP_DB_PASSWORD:-apppw}"
      Jwt__Issuer: "trino-supply"
      Jwt__Audience: "trino-supply"
      Jwt__Keys__0__Kid: "pilot-1"
      Jwt__Keys__0__Secret: ${JWT_SIGNING_SECRET:-troque-esta-chave-de-piloto-com-mais-de-32-bytes!!}
      # Provisionamento de empresas (POST /companies) exige este header X-Provisioning-Key (SEC-001).
      Provisioning__Key: ${PROVISIONING_KEY:-chave-de-provisionamento-do-piloto}
      # E-mail transacional (convite/recuperação de senha). Sem SMTP_HOST, a API loga o link em vez
      # de enviar (fallback do piloto) — o operador copia o link do log do container `api`.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__From: ${SMTP_FROM:-no-reply@trinosupply.local}
      # Base dos links enviados por e-mail (tela /criar-senha do frontend).
      Email__WebBaseUrl: ${WEB_BASE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    ports:
      - "5098:8080"

  # Relay do Outbox (ARC-005): drena eventos de negócio pendentes e os publica.
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      # Role dedicada do worker: cross-tenant SÓ no outbox (policy por current_user), sem BYPASSRLS.
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=trino;Username=trino_worker;Password=${WORKER_DB_PASSWORD:-workerpw}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__User: "trino"
      RabbitMq__Password: "trino"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: "http://api:8080"
    ports:
      - "3000:3000"

  # Backup diário do banco (OPS-001): pg_dump comprimido em volume, retenção de 14 dias.
  # Restaurar: pg_restore -h db -U trino -d trino --clean /backups/<arquivo>.dump
  backup:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: trino
    volumes:
      - backups:/backups
    entrypoint: >
      sh -c "while true; do
        pg_dump -h db -U trino -d trino -F c -f /backups/trino-$$(date +%Y%m%d-%H%M).dump
        && echo \"backup ok: $$(date)\";
        find /backups -name '*.dump' -mtime +14 -delete;
        sleep 86400;
      done"

volumes:
  backups:
